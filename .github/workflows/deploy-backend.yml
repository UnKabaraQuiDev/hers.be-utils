name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BACKEND_HOST }}
          port: ${{ secrets.BACKEND_PORT }}
          username: ${{ secrets.BACKEND_USER }}
          key: ${{ secrets.BACKEND_SSH_KEY }}

          proxy_host: ${{ secrets.PROXY_HOST }}
          proxy_port: ${{ secrets.PROXY_PORT }}
          proxy_username: ${{ secrets.PROXY_USER }}
          proxy_key: ${{ secrets.PROXY_SSH_KEY }}
          
          script: |
            set -e

            REPO_DIR="${{ vars.BACKEND_DIR }}"
            REPO_URL="https://x-access-token:${{ secrets.WORKFLOW_PAT }}@github.com/UnKabaraQuiDev/hers.be-utils.git"
            BRANCH="main"

            export REPO_DIR="$REPO_DIR"
            export CONTAINER_PORT="${{ vars.BACKEND_CONTAINER_PORT }}"
            export CALENDAR_URL="${{ vars.CALENDAR_URL }}"
            export MENU_FACEBOOK="${{ vars.MENU_FACEBOOK }}"
            export MENU_COOKIES="${{ secrets.MENU_COOKIES }}"
            export NTFY_ALERT="${{ vars.NTFY_ALERT }}"
            export NTFY_MENU="${{ vars.NTFY_MENU }}"
            export NTFY_FILES="${{ vars.NTFY_FILES }}"
            export EXT_ENABLED="${{ vars.EXT_ENABLED }}"
            export EXT_HOST="${{ secrets.EXT_HOST }}"
            export EXT_PASSWORD="${{ secrets.EXT_PASSWORD }}"
            export EXT_PORT="${{ secrets.EXT_PORT }}"
            export EXT_USERNAME="${{ secrets.EXT_USERNAME }}"
            export CALENDAR_CLASS="${{ vars.CLASS_NAME }}"
            export CALENDAR_KEY="${{ vars.CALENDAR_KEY }}"
            export DWN_WEBHOOK_TOKEN="${{ vars.DWN_WEBHOOK_TOKEN }}"
            export DWN_PORTAL_INDEX="${{ vars.DWN_PORTAL_INDEX }}"
            export DWN_PORTAL_USERNAME="${{ secrets.DWN_PORTAL_USERNAME }}"
            export DWN_PORTAL_PASSWORD="${{ secrets.DWN_PORTAL_PASSWORD }}"
            export DWN_BACK_DIR="${{ vars.DWN_BACK_DIR }}"
            export DWN_FRONT_DIR="${{ vars.DWN_FRONT_DIR }}"
            export DWN_TARGET_HOST_DIR="${{ vars.DWN_TARGET_HOST_DIR }}"

            git config --global --add safe.directory "$REPO_DIR"
            export GIT_LFS_SKIP_SMUDGE=1

            if [ ! -d "$REPO_DIR/.git" ]; then
              mkdir -p "$(dirname "$REPO_DIR")"

              git clone \
                --branch "$BRANCH" \
                --single-branch \
                --no-tags \
                --depth 1 \
                "$REPO_URL" \
                "$REPO_DIR"
            else
              cd "$REPO_DIR"

              git fetch \
                --depth 1 \
                --no-tags \
                --no-write-fetch-head \
                origin \
                "$BRANCH"

              git checkout "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$REPO_DIR"

            docker compose build
