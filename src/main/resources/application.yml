spring:
  application:
    name: webcal-cmp
    host-url: ""

server:
  port: 8080
  forward-headers-strategy: framework

calendar:
  url: ""
  class: ""
  zone: "Europe/Luxembourg"
  key: ""
  proxy:
    enabled: true
    host: ""
    port: 3128
    username: ""
    password: ""

ntfy:
  alert: ""
  menu: ""
  files: "${NTFY_FILES:}"

menu:
  facebook: ""
  title: "MENU DE LA SEMAINE"
  cookies: ""
  ocr:
    executable: "tesseract"
    language: "fra"

logging:
  level:
    net.fortuna.ical4j.data.CalendarOutputter: ERROR
    
pclib:
  db:
    enabled: true
    
    sqlite:
      protocol: sqlite
      dir-path: "${PCLIB_DB_SQLITE_PATH:./db}"

dwn:
  portal:
    index: "${DWN_PORTAL_INDEX:https://my.hers.be/FW/index.do}"
    username: ""
    password: ""
  root-dir: ""
  link-dir: ""
  target-dir: ""
  webhook-token: ""
  download-timeout-seconds: 900
  retries: 3
