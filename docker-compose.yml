services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hers.be-utils
    ports:
      - "${CONTAINER_PORT}:8080"
    shm_size: "1gb"
    environment:
      CALENDAR_URL: ${CALENDAR_URL}
      MENU_FACEBOOK: ${MENU_FACEBOOK}
      NTFY_ALERT: ${NTFY_ALERT}
      NTFY_MENU: ${NTFY_MENU}
      CALENDAR_PROXY_ENABLED: ${EXT_ENABLED}
      CALENDAR_PROXY_HOST: ${EXT_HOST}
      CALENDAR_PROXY_PORT: ${EXT_PORT}
      CALENDAR_PROXY_USERNAME: ${EXT_USERNAME}
      CALENDAR_PROXY_PASSWORD: ${EXT_PASSWORD}
      CALENDAR_CLASS: ${CALENDAR_CLASS}
      CALENDAR_KEY: ${CALENDAR_KEY}
      MENU_FACEBOOK_COOKIES: ${MENU_FACEBOOK_COOKIES:-}
      PCLIB_DB_SQLITE_PATH: "/app/db/"
      TZ: Europe/Luxembourg
      JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Luxembourg
    restart: unless-stopped
    volumes:
      - db-data:/app/db

volumes:
  db-data:
  