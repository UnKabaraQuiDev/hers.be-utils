services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hers.be-utils
    ports:
      - "${CONTAINER_PORT}:8080"
    shm_size: "1gb"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      CALENDAR_URL: ${CALENDAR_URL}
      MENU_FACEBOOK: ${MENU_FACEBOOK}
      NTFY_ALERT: ${NTFY_ALERT}
      NTFY_MENU: ${NTFY_MENU}
      NTFY_FILES: ${NTFY_FILES}
      DWN_PORTAL_INDEX: ${DWN_PORTAL_INDEX}
      DWN_PORTAL_USERNAME: ${DWN_PORTAL_USERNAME}
      DWN_PORTAL_PASSWORD: ${DWN_PORTAL_PASSWORD}
      DWN_TARGET_DIR: /app/downloads/${DWN_BACK_DIR:-back}
      MOODLE_TARGET_DIR: /app/downloads/${MOODLE_BACK_DIR:-moodle-back}
      MOODLE_COURSES_URL: ${MOODLE_COURSES_URL}
      DWN_DIRECTORY_RETRY_DELAY_SECONDS: ${DWN_DIRECTORY_RETRY_DELAY_SECONDS:-5}
      DWN_LINK_DIR: /app/downloads/${DWN_FRONT_DIR:-}
      DWN_ROOT_DIR: /app/downloads
      DWN_WEBHOOK_TOKEN: ${DWN_WEBHOOK_TOKEN}
      CALENDAR_PROXY_ENABLED: ${EXT_ENABLED}
      CALENDAR_PROXY_HOST: ${EXT_HOST}
      CALENDAR_PROXY_PORT: ${EXT_PORT}
      CALENDAR_PROXY_USERNAME: ${EXT_USERNAME}
      CALENDAR_PROXY_PASSWORD: ${EXT_PASSWORD}
      CALENDAR_CLASS: ${CALENDAR_CLASS}
      CALENDAR_KEY: ${CALENDAR_KEY}
      MENU_FACEBOOK_COOKIES: ${MENU_FACEBOOK_COOKIES}
      PCLIB_DB_SQLITE_PATH: "/app/db/"
      TZ: Europe/Luxembourg
      JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Luxembourg
    restart: unless-stopped
    volumes:
      - db-data:/app/db
      - ${DWN_TARGET_HOST_DIR}:/app/downloads

volumes:
  db-data:
  